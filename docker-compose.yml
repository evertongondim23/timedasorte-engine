version: '3.8'

services:
  # ===============================================
  # 🗄️ BANCO DE DADOS POSTGRESQL
  # ===============================================
  postgres:
    image: postgres:15-alpine
    container_name: jogo-sorte-db
    restart: unless-stopped
    ports:
      - '5452:5432'
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-jogo_da_sorte}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - jogo-sorte-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ===============================================
  # 🚀 API NESTJS
  # ===============================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jogo-sorte-api
    restart: unless-stopped
    ports:
      - '${PORT:-3020}:${PORT:-3020}'
    environment:
      # Database
      DATABASE_URL: postgresql://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-postgres}@postgres:5432/${DATABASE_NAME:-jogo_da_sorte}?schema=public
      
      # Application
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3020}
      
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      
      # Admin credentials (first run)
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@jogodasorte.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
      
      # Official Provider (opcional)
      OFFICIAL_PROVIDER_ENABLED: ${OFFICIAL_PROVIDER_ENABLED:-false}
      OFFICIAL_PROVIDER_API_URL: ${OFFICIAL_PROVIDER_API_URL:-}
      OFFICIAL_PROVIDER_API_KEY: ${OFFICIAL_PROVIDER_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jogo-sorte-network
    volumes:
      - ./logs:/app/logs
    command: >
      sh -c "
        echo '🔄 Aguardando banco de dados...' &&
        npx prisma migrate deploy &&
        echo '✅ Migrações aplicadas' &&
        npx prisma db seed &&
        echo '✅ Dados iniciais carregados' &&
        npm run start:prod
      "

# ===============================================
# 🌐 REDE
# ===============================================
networks:
  jogo-sorte-network:
    driver: bridge

# ===============================================
# 💾 VOLUMES
# ===============================================
volumes:
  postgres_data:
    driver: local
